buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            url = 'https://packages.confluent.io/maven/'
        }
        maven {
            url = 'https://jitpack.io'
        }
    }
    dependencies {
        classpath 'gradle.plugin.com.github.jengelman.gradle.plugins:shadow:7.0.0'
    }
}

plugins {
    id 'java'
    id 'com.google.cloud.tools.jib' version '3.3.1'
    id 'idea'
    id 'eclipse'
    id 'com.github.imflog.kafka-schema-registry-gradle-plugin' version '2.5.0'
    id 'com.github.davidmc24.gradle.plugin.avro' version '1.9.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
version = '0.0.1'

repositories {
    mavenCentral()

    maven {
        url 'https://packages.confluent.io/maven'
    }
}

apply plugin: 'com.github.johnrengelman.shadow'

dependencies {
    implementation 'org.slf4j:slf4j-simple:2.0.18'
    implementation 'org.apache.kafka:kafka-clients:4.3.1'
    implementation 'org.apache.kafka:kafka-streams:4.3.1'
    implementation 'org.apache.avro:avro:1.11.1'
    implementation 'io.confluent:kafka-avro-serializer:8.3.0'
    testImplementation 'com.google.guava:guava:33.6.0-jre'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.1'
    testImplementation 'org.testcontainers:testcontainers:2.0.5'
    testImplementation 'org.hamcrest:hamcrest:3.0'
}

test {
    useJUnitPlatform()
    testLogging {
        outputs.upToDateWhen { false }
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

jar {
  manifest {
    attributes(
      'Class-Path': configurations.compileClasspath.collect { it.getName() }.join(' '),
      'Main-Class': 'io.confluent.developer.MultiEventAvroProduceConsumeApp'
    )
  }
}

shadowJar {
    archiveBaseName = 'multiple-event-types-avro-standalone'
    archiveClassifier = ''
}

schemaRegistry {
    url = 'http://localhost:8081'
    register {
        subject('avro-events-value', 'multiple-event-types-avro/kafka/src/main/avro/all-events.avsc', "AVRO")
    }
}

tasks.named('registerSchemasTask') {
    outputs.upToDateWhen { false }
}